# ==============================================================================
# PICC-PP-User-Portal-Backend - Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=PICC-PP-User-Portal-Backend

# Active Spring Profile (Override via SPRING_PROFILES_ACTIVE=dev | main | local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Cloud Config Label
spring.cloud.config.label=${CONFIG_LABEL:v1}

# Optional Centralized Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}/nnp-config

# ------------------------------------------------------------------------------
# Security & CORS Configuration
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ------------------------------------------------------------------------------
# Primary Relational Database Configuration (portal schema)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nnp_portal?currentSchema=portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# DevSecOps Database Configuration
spring.datasource.devsecops.url=${SPRING_DATASOURCE_DEVSECOPS_URL:jdbc:postgresql://localhost:5432/nnp_devsecops}
spring.datasource.devsecops.username=${SPRING_DATASOURCE_DEVSECOPS_USERNAME:postgres}
spring.datasource.devsecops.password=${SPRING_DATASOURCE_DEVSECOPS_PASSWORD:postgres}
spring.datasource.devsecops.driver-class-name=org.postgresql.Driver

# ApiEcosystem Database Configuration
spring.datasource.apiecosystem.url=${SPRING_DATASOURCE_APIECOSYSTEM_URL:jdbc:postgresql://localhost:5432/nnp_apiecosystem}
spring.datasource.apiecosystem.username=${SPRING_DATASOURCE_APIECOSYSTEM_USERNAME:postgres}
spring.datasource.apiecosystem.password=${SPRING_DATASOURCE_APIECOSYSTEM_PASSWORD:postgres}
spring.datasource.apiecosystem.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Redis Cache Configuration (User URL authorization caching)
# ------------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# ------------------------------------------------------------------------------
# Apache Kafka Configuration
# ------------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:99999}
kafka.topic.podusage=${KAFKA_TOPIC_PODUSAGE:nnp-pod-usage}
kafka.topic.metricprediction=${KAFKA_TOPIC_METRICPREDICTION:nnp-metric-prediction}

# ------------------------------------------------------------------------------
# Telemetry & Observability Providers
# ------------------------------------------------------------------------------
# SigNoz APM
signoz.url=${SIGNOZ_URL:http://localhost:3301}
signoz.apiKey=${SIGNOZ_API_KEY:}

# Prometheus Metrics
prometheus.url=${PROMETHEUS_URL:http://localhost:9090}
prometheus.stub.enabled=${PROMETHEUS_STUB_ENABLED:false}

# Loki Log Aggregation
loki.url=${LOKI_URL:http://localhost:3100}

# ------------------------------------------------------------------------------
# External Integration Endpoints
# ------------------------------------------------------------------------------
# Redmine Issue Tracking
redmine.baseUrl=${REDMINE_URL:http://localhost:3000}
redmine.apiKey=${REDMINE_API_KEY:}
redmine.baseProjectId=${REDMINE_BASE_PROJECT_ID:}

# Kubernetes Integration Service
k8sintg.service.url=${K8SINTG_SERVICE_URL:http://localhost:8082}

# ------------------------------------------------------------------------------
# Background Schedulers Configuration
# ------------------------------------------------------------------------------
scheduler.enabled=${SCHEDULER_ENABLED:true}

# Usage data hourly collection
scheduler.usage-data.enabled=${SCHEDULER_USAGE_DATA_ENABLED:true}
scheduler.usage-data.cron=${SCHEDULER_USAGE_DATA_CRON:0 0 * * * *}

# Log data hourly collection
scheduler.logs-data.enabled=${SCHEDULER_LOGS_DATA_ENABLED:true}
scheduler.logs-data.cron=${SCHEDULER_LOGS_DATA_CRON:0 0 * * * *}

# Pipeline data hourly collection
scheduler.pipeline-data.enabled=${SCHEDULER_PIPELINE_DATA_ENABLED:true}
scheduler.pipeline-data.cron=${SCHEDULER_PIPELINE_DATA_CRON:0 0 * * * *}

# API Gateway data hourly collection
scheduler.apigateway-data.enabled=${SCHEDULER_APIGATEWAY_DATA_ENABLED:true}
scheduler.apigateway-data.cron=${SCHEDULER_APIGATEWAY_DATA_CRON:0 0 * * * *}

# Pod usage paced chunking collection
scheduler.pod-usage-data.enabled=${SCHEDULER_POD_USAGE_DATA_ENABLED:true}
scheduler.pod-usage-data.cron=${SCHEDULER_POD_USAGE_DATA_CRON:0 * * * * *}
scheduler.pod-usage-data.chunking.enabled=${SCHEDULER_POD_USAGE_CHUNKING_ENABLED:true}
scheduler.pod-usage-data.chunking.namespaces=${SCHEDULER_POD_USAGE_CHUNKING_NAMESPACES:nnp-core-components}
scheduler.pod-usage-data.chunking.namespace-batch-size=${SCHEDULER_POD_USAGE_CHUNKING_BATCH_SIZE:1}
scheduler.pod-usage-data.chunking.delay-between-chunks-ms=${SCHEDULER_POD_USAGE_CHUNKING_DELAY_MS:1000}
scheduler.pod-usage-data.chunking.collection-window-ms=${SCHEDULER_POD_USAGE_CHUNKING_WINDOW_MS:60000}

# Test prediction generator scheduler
prediction.test.schedular.active=${PREDICTION_TEST_SCHEDULER_ACTIVE:false}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# ------------------------------------------------------------------------------
# Actuator & Observability
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.nnp.dashboard=${LOG_LEVEL:INFO}
