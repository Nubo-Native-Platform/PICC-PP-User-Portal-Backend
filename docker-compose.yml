services:
  user-portal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: picc-pp-user-portal-backend:latest
    container_name: user-portal-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-main}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/nnp_portal?currentSchema=portal}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DEVSECOPS_URL=${SPRING_DATASOURCE_DEVSECOPS_URL:-jdbc:postgresql://postgres:5432/nnp_devsecops}
      - SPRING_DATASOURCE_DEVSECOPS_USERNAME=${SPRING_DATASOURCE_DEVSECOPS_USERNAME:-postgres}
      - SPRING_DATASOURCE_DEVSECOPS_PASSWORD=${SPRING_DATASOURCE_DEVSECOPS_PASSWORD:-postgres}
      - SPRING_DATASOURCE_APIECOSYSTEM_URL=${SPRING_DATASOURCE_APIECOSYSTEM_URL:-jdbc:postgresql://postgres:5432/nnp_apiecosystem}
      - SPRING_DATASOURCE_APIECOSYSTEM_USERNAME=${SPRING_DATASOURCE_APIECOSYSTEM_USERNAME:-postgres}
      - SPRING_DATASOURCE_APIECOSYSTEM_PASSWORD=${SPRING_DATASOURCE_APIECOSYSTEM_PASSWORD:-postgres}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - PROMETHEUS_STUB_ENABLED=${PROMETHEUS_STUB_ENABLED:-false}
      - LOKI_URL=${LOKI_URL:-http://localhost:3100}
      - SIGNOZ_URL=${SIGNOZ_URL:-http://localhost:3301}
      - SIGNOZ_API_KEY=${SIGNOZ_API_KEY:-}
      - REDMINE_URL=${REDMINE_URL:-http://localhost:3000}
      - REDMINE_API_KEY=${REDMINE_API_KEY:-}
      - REDMINE_BASE_PROJECT_ID=${REDMINE_BASE_PROJECT_ID:-}
      - K8SINTG_SERVICE_URL=${K8SINTG_SERVICE_URL:-http://localhost:8082}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL:-http://localhost:8888}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    container_name: nnp-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nnp_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nnp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nnp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nnp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  pgdata:
